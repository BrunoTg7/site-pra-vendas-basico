<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="icon_for_to-do_list-removebg-preview (1).png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main>
      <h1>To Do list</h1>
      <button id="sair">
        <img src="icon_for_to-do_list-removebg-preview.png" alt="" />
      </button>
      <div class="container">
        <div class="login">
          <label for="email">Email: </label>
          <input
            type="email"
            id="email"
            placeholder="bruno@gmail.com"
            required
          />
          <label for="senha">Senha: </label>
          <input type="password" name="" id="senha" minlength="8" required />

          <button id="logar" type="button">Login</button>
        </div>
        <div class="cadastro">
          <label for="email">Email: </label>
          <input
            type="email"
            id="email1"
            placeholder="bruno@gmail.com"
            required
          />
          <label for="senha">Senha: </label>
          <input type="password" name="" id="senha1" minlength="8" required />

          <button id="cadastro" type="button">Cadastrar</button>
        </div>

        <div class="tarefa" style="display: none"></div>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
