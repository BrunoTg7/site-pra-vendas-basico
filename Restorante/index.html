<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restorante</title>
    <link
      rel="stylesheet"
      href="https://necolas.github.io/normalize.css/8.0.1/normalize.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="/"
          ><img src="./img/restorante/images-removebg-preview.png" alt=""
        /></a>
      </div>
      <div class="instagram">
        <a href="https://www.instagram.com/bruno_tg9/"
          ><img src="./img/restorante/instagram-svgrepo-com (1).png" alt=""
        /></a>
      </div>
    </header>
    <main>
      <div class="entrada">
        <img
          src="./img/restorante/floral-design-icon-flower-vines-and-leaves-right-border-icon-art-icon-p8R8NbfM-removebg-preview.png"
          class="flor"
          alt=""
        />
        <img src="./img/restorante/floral.png" class="flor2" alt="" />
        <img
          src="./img/restorante/2513150_353917-PAXE6G-291__1_-removebg-preview (1).png"
          class="molde"
          alt=""
        />
        <div class="header-content">
          <h1>Bem-vindo ao Restaurante</h1>
        </div>
        <div class="content">
          <p>Servimos a melhor culinária da cidade!</p>
        </div>
      </div>

      <div class="galeria"></div>
      <div class="overlay" id="overlay">
        <div class="content">
          <button class="close-btn" onclick="fecharOverlay()">X</button>
          <img id="foto-grande" src="" alt="Foto Grande" />
          <div class="painel" id="painel-info"></div>
        </div>
      </div>

      <div class="sobre-section">
        <img
          src="./img/restorante/images-removebg-preview.png"
          alt="Imagem do Restaurante"
          class="sobre-img"
        />
        <div class="sobre-text">
          <h2>Sobre Nós</h2>
          <p>
            Saiba mais sobre nossa história e contato clicando no botão abaixo.
          </p>
          <a href="/restorante/sobre" class="btn-sobre">Saiba Mais</a>
        </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 Restorante. All rights reserved.</p>
    </footer>
    <script src="./index.js"></script>
  </body>
</html>
